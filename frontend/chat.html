<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.Connect - Messages</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ========================================
           CHAT PAGE — THEME-ALIGNED REDESIGN
        ========================================= */

        body {
            overflow: hidden;
        }

        /* Animated ambient background orbs */
        body::after {
            content: '';
            position: fixed;
            top: -20%;
            right: -10%;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: orb-drift 8s ease-in-out infinite alternate;
        }

        @keyframes orb-drift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(-40px, 30px) scale(1.1); }
        }

        /* ── Layout ── */
        .chat-page-wrapper {
            display: flex;
            height: calc(100vh - 70px);
            max-width: 1300px;
            margin: 0 auto;
            padding: 1.5rem 1.5rem 1.5rem;
            gap: 1.5rem;
            position: relative;
            z-index: 1;
        }

        /* ── Sidebar ── */
        .chat-sidebar {
            width: 300px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            animation: slideInLeft 0.5s cubic-bezier(0.4,0,0.2,1) both;
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-24px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .chat-sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(245,158,11,0.04);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .chat-sidebar-header .sidebar-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.85rem;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .chat-sidebar-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
            letter-spacing: -0.02em;
        }

        .search-box {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .search-box input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.875rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-box {
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 2.3rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 0.8rem;
            pointer-events: none;
        }

        .search-box input:focus {
            border-color: var(--accent);
            background: rgba(245,158,11,0.05);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .connections-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            margin: 0;
            padding: 0.5rem 0;
        }

        /* Custom amber scrollbar */
        .connections-list::-webkit-scrollbar { width: 4px; }
        .connections-list::-webkit-scrollbar-track { background: transparent; }
        .connections-list::-webkit-scrollbar-thumb {
            background: rgba(245,158,11,0.25);
            border-radius: 10px;
        }
        .connections-list::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .connection-item {
            padding: 0.85rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.875rem;
            cursor: pointer;
            transition: all 0.25s ease;
            border-radius: 0;
            border-left: 3px solid transparent;
            position: relative;
        }

        .connection-item:hover {
            background: rgba(245,158,11,0.07);
            border-left-color: rgba(245,158,11,0.4);
        }

        .connection-item.active {
            background: rgba(245,158,11,0.1);
            border-left-color: var(--accent);
        }

        .connection-item.active .connection-name {
            color: var(--accent);
        }

        .connection-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(245,158,11,0.3);
            position: relative;
        }

        .connection-avatar .online-dot {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            border: 2px solid var(--bg-primary);
        }

        .connection-info {
            flex: 1;
            min-width: 0;
        }

        .connection-name {
            margin: 0 0 0.2rem 0;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            transition: color 0.25s;
        }

        .connection-preview {
            margin: 0;
            font-size: 0.78rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── Main Chat Window ── */
        .chat-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            animation: slideInRight 0.5s cubic-bezier(0.4,0,0.2,1) both;
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(24px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* ── Chat Header ── */
        .chat-header {
            padding: 1.1rem 1.75rem;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(245,158,11,0.03);
            backdrop-filter: blur(10px);
        }

        .chat-header-info h3 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .chat-header-info .status {
            margin: 0;
            font-size: 0.78rem;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .chat-header-info .status::before {
            content: '';
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .chat-header-actions {
            margin-left: auto;
            display: flex;
            gap: 0.5rem;
        }

        .header-action-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s;
            font-size: 0.85rem;
        }

        .header-action-btn:hover {
            background: rgba(245,158,11,0.1);
            border-color: var(--accent);
            color: var(--accent);
            transform: scale(1.05);
        }

        /* ── Messages Area ── */
        .chat-messages {
            flex: 1;
            padding: 1.75rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            /* Eye catching mesh grid and glow */
            background-color: rgba(12, 10, 9, 0.65);
            background-image: 
                radial-gradient(circle at 80% 20%, rgba(245, 158, 11, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(245, 158, 11, 0.08) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 25px 25px, 25px 25px;
            background-position: 0 0, 0 0, 0 0, 0 0;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(245,158,11,0.2);
            border-radius: 10px;
        }

        /* Date separator */
        .date-separator {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 0.5rem 0 1rem;
        }
        .date-separator span {
            font-size: 0.75rem;
            color: var(--text-secondary);
            white-space: nowrap;
            padding: 0.25rem 0.75rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--glass-border);
            border-radius: 999px;
        }
        .date-separator-line {
            flex: 1;
            height: 1px;
            background: var(--glass-border);
        }

        /* Message bubble */
        .message-wrapper {
            display: flex;
            flex-direction: column;
            animation: msgPop 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
        }

        @keyframes msgPop {
            from { opacity: 0; transform: translateY(12px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message-wrapper.outgoing {
            align-items: flex-end;
        }

        .message-wrapper.incoming {
            align-items: flex-start;
        }

        .message {
            max-width: 68%;
            padding: 0.875rem 1.125rem;
            border-radius: 18px;
            font-size: 0.93rem;
            line-height: 1.55;
            position: relative;
            word-break: break-word;
        }

        .message.incoming {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            border-bottom-left-radius: 5px;
        }

        .message.outgoing {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
            color: #fff;
            border-bottom-right-radius: 5px;
            box-shadow: 0 4px 20px rgba(245,158,11,0.35);
        }

        .message .timestamp {
            display: block;
            font-size: 0.68rem;
            margin-top: 0.4rem;
            opacity: 0.6;
            text-align: right;
        }

        .message.outgoing .timestamp {
            color: rgba(255,255,255,0.8);
        }

        .message.incoming .timestamp {
            color: var(--text-secondary);
        }

        /* Read receipt tick */
        .message.outgoing .tick {
            display: inline-block;
            margin-left: 0.2rem;
            font-size: 0.65rem;
            color: rgba(255,255,255,0.75);
        }

        /* ── Input Area ── */
        .chat-input-area {
            padding: 1.1rem 1.5rem;
            border-top: 1px solid var(--glass-border);
            background: rgba(245,158,11,0.02);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .input-attach-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.25s;
            font-size: 0.9rem;
        }

        .input-attach-btn:hover {
            background: rgba(245,158,11,0.1);
            border-color: var(--accent);
            color: var(--accent);
        }

        .chat-input-wrapper {
            flex: 1;
            position: relative;
        }

        .chat-input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 0.8rem 1.25rem;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.93rem;
            outline: none;
            transition: all 0.3s;
            resize: none;
        }

        .chat-input::placeholder { color: var(--text-secondary); opacity: 0.7; }

        .chat-input:focus {
            border-color: var(--accent);
            background: rgba(245,158,11,0.05);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: #fff;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            box-shadow: 0 4px 15px rgba(245,158,11,0.4);
        }

        .send-btn:hover {
            transform: scale(1.08) translateY(-1px);
            box-shadow: 0 6px 22px rgba(245,158,11,0.55);
            filter: brightness(1.1);
        }

        .send-btn:active {
            transform: scale(0.96);
        }

        /* ── Empty / Welcome State ── */
        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            color: var(--text-secondary);
            padding: 2rem;
            text-align: center;
        }

        .empty-chat-icon {
            width: 90px;
            height: 90px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(245,158,11,0.12), rgba(245,158,11,0.04));
            border: 1px solid rgba(245,158,11,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-10px); }
        }

        .empty-chat h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }

        .empty-chat p {
            font-size: 0.9rem;
            max-width: 280px;
            margin: 0;
        }

        /* ── Navbar override for this page ── */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2.5rem;
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
            height: 70px;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -1px;
            text-decoration: none;
        }

        .nav-brand i { color: var(--accent); font-size: 1.2rem; }
        .nav-brand span { color: var(--accent); }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 0;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            margin-left: 1.75rem;
            font-weight: 500;
            transition: color 0.3s;
            font-size: 0.9rem;
        }

        .nav-links a:hover { color: var(--accent); }
        .nav-links a.active {
            color: var(--accent);
            font-weight: 600;
        }

        /* Empty connections state */
        .empty-connections {
            padding: 2rem 1.5rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .empty-connections i {
            font-size: 2rem;
            color: rgba(245,158,11,0.3);
            display: block;
            margin-bottom: 0.75rem;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="dashboard.html" class="nav-brand">
            <i class="fas fa-network-wired"></i>
            <span>.</span>Connect
        </a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="connect.html">Connections</a>
            <a href="chat.html" class="active">Messages</a>
            <a href="jobs.html">Jobs</a>
            <a href="interview.html">Interview Prep</a>
            <a href="leaderboard.html">Leaderboard</a>
            <a href="profile.html">Profile</a>
            <a href="#" onclick="logout()" class="btn btn-secondary" style="padding: 0.4rem 1rem; margin-left: 1.5rem; font-size: 0.85rem;">Logout</a>
        </div>
    </nav>

    <!-- Chat Layout -->
    <div class="chat-page-wrapper">

        <!-- Sidebar -->
        <div class="chat-sidebar">
            <div class="chat-sidebar-header">
                <div class="sidebar-icon">
                    <i class="fas fa-comments"></i>
                </div>
                <h2>Messages</h2>
            </div>

            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchConnections" placeholder="Search connections..." autocomplete="off">
            </div>

            <ul class="connections-list" id="connectionsList">
                <div class="empty-connections">
                    <i class="fas fa-user-friends"></i>
                    Loading connections...
                </div>
            </ul>
        </div>

        <!-- Chat Window -->
        <div class="chat-window" id="chatWindow">
            <div class="empty-chat">
                <div class="empty-chat-icon">
                    <i class="fas fa-paper-plane"></i>
                </div>
                <h3>Start a Conversation</h3>
                <p>Select a connection from the list to send a message and grow your network.</p>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
