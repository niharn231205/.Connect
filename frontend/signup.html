<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Sign Up - .Connect</title>
    <link href="/css/style.css" rel="stylesheet" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link href="/css/studio.css" rel="stylesheet" />
  </head>
  <body class="auth-page page-signup">
    <a class="auth-back" href="/">← Back to .Connect</a>
    <aside class="auth-story">
      <span class="eyebrow">YOUR CAREER, IN THE MAKING</span>
      <h1>A little ambition.<br /><em>A new chapter.</em></h1>
      <p>
        Your resume, your practice, your people.<br />Make room for what comes
        next.
      </p>
      <div class="auth-story-line">01 / Start with you</div>
    </aside>
    <div class="center-content container animate-fade">
      <div class="glass-card" style="width: 100%; max-width: 440px">
        <header style="text-align: center; margin-bottom: 2rem">
          <a class="logo" href="/" style="margin-bottom: 0.5rem; display: block"
            >.<span>Connect</span>.</a
          >
          <h2>Start your next chapter.</h2>
          <p>Start your professional journey</p>
        </header>
        <div class="error" id="error-msg" role="alert"></div>
        <form id="signup-form">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input
              autocomplete="name"
              class="form-control"
              id="name"
              placeholder="John Doe"
              required=""
              type="text"
            />
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              autocomplete="email"
              class="form-control"
              id="email"
              placeholder="name@company.com"
              required=""
              type="email"
            />
          </div>
          <div class="form-group">
            <label for="password">Create Password</label>
            <div style="position: relative">
              <input
                autocomplete="new-password"
                class="form-control"
                id="password"
                placeholder="••••••••"
                required=""
                style="padding-right: 2.5rem"
                type="password"
              />
              <i
                class="fas fa-eye toggle-password"
                style="
                  position: absolute;
                  right: 1rem;
                  top: 50%;
                  transform: translateY(-50%);
                  cursor: pointer;
                  color: var(--text-secondary);
                "
              ></i>
            </div>
          </div>
          <button
            class="btn btn-primary btn-block"
            style="margin-top: 1rem"
            type="submit"
          >
            Create Account
          </button>
        </form>
        <p style="text-align: center; margin-top: 2rem; font-size: 0.9rem">
          Already part of the tribe?
          <a
            href="/login.html"
            style="
              color: var(--accent);
              font-weight: 600;
              text-decoration: none;
            "
            >Sign In</a
          >
        </p>
      </div>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
  </body>
</html>
