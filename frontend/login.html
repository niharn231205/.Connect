<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - .Connect</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="center-content container animate-fade">
        <div class="glass-card" style="width: 100%; max-width: 440px;">
            <header style="text-align: center; margin-bottom: 2rem;">
                <a href="/" class="logo" style="margin-bottom: 0.5rem; display: block;">.<span>Connect</span>.</a>
                <p>Sign in to your professional hub</p>
            </header>
            
            <div id="error-msg" class="error"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" required placeholder="name@company.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" class="form-control" required placeholder="••••••••" style="padding-right: 2.5rem;">
                        <i class="fas fa-eye toggle-password" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-secondary);"></i>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Sign In</button>
            </form>
            
            <p style="text-align: center; margin-top: 2rem; font-size: 0.9rem;">
                New to .Connect? <a href="/signup.html" style="color: var(--accent); font-weight: 600; text-decoration: none;">Create an account</a>
            </p>
        </div>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
