<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Questionnaire - .Connect</title>
    <link href="/css/style.css" rel="stylesheet" />
    <link href="/css/studio.css" rel="stylesheet" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="app-page page-questions">
    <a class="skip-link" href="#app-main">Skip to content</a>
    <header class="mobile-header">
      <a class="logo" href="/dashboard.html">.<span>Connect</span>.</a
      ><button
        aria-controls="studio-sidebar"
        aria-expanded="false"
        aria-label="Open navigation"
        class="menu-toggle"
      >
        <i aria-hidden="true" class="fas fa-bars"></i>
      </button>
    </header>
    <div class="nav-backdrop" hidden=""></div>
    <aside class="studio-sidebar" id="studio-sidebar">
      <a aria-label=".Connect home" class="logo" href="/"
        >.<span>Connect</span>.</a
      >
      <div class="studio-label">YOUR CAREER STUDIO</div>
      <nav aria-label="Workspace">

        <a href="/dashboard.html"
          ><i aria-hidden="true" class="fas fa-house"></i
          ><span>Overview</span></a
        ><a href="/resume.html"
          ><i aria-hidden="true" class="fas fa-file-lines"></i
          ><span>Your resume</span></a
        ><a href="/apply-jobs.html"><i aria-hidden="true" class="fas fa-arrow-up-right-from-square"></i><span>Apply for jobs</span></a><a href="/jobs.html"
          ><i aria-hidden="true" class="fas fa-briefcase"></i
          ><span>Role catalogue</span></a
        ><a href="/matcher.html"
          ><i aria-hidden="true" class="fas fa-arrows-left-right"></i
          ><span>Resume matcher</span></a
        ><a href="/interview.html"
          ><i aria-hidden="true" class="fas fa-comment-dots"></i
          ><span>Interview practice</span></a
        ><a href="/connect.html"
          ><i aria-hidden="true" class="fas fa-user-group"></i
          ><span>Connections</span></a
        ><a href="/chat.html"
          ><i aria-hidden="true" class="fas fa-envelope"></i
          ><span>Messages</span></a
        ><a href="/leaderboard.html"
          ><i aria-hidden="true" class="fas fa-ranking-star"></i
          ><span>Leaderboard</span></a
        ><a href="/profile.html"
          ><i aria-hidden="true" class="fas fa-user"></i
          ><span>Your profile</span></a
        >
      </nav>
      <div class="sidebar-note">
        <span class="tiny-dot"></span> A little progress, every day.
      </div>
      <button class="logout-button" onclick="logout()" type="button">
        <i aria-hidden="true" class="fas fa-arrow-right-from-bracket"></i> Sign
        out
      </button>
    </aside>
    <main class="workspace" id="app-main" tabindex="-1">
      <div class="container animate-fade">
        <div class="center-content">
          <div class="glass-card" style="max-width: 600px; width: 100%">
            <header style="margin-bottom: 2rem">
              <h1 style="margin-bottom: 0.5rem; color: var(--accent)">
                Personalize Your Path
              </h1>
              <p>
                Help us tailor your experience by answering a few quick
                questions.
              </p>
            </header>
            <div
              class="error"
              id="error-msg"
              role="alert"
              style="margin-bottom: 1.5rem"
            ></div>
            <form id="questions-form">
              <div class="form-group">
                <label for="field">Professional Field</label>
                <select
                  class="form-control"
                  id="field"
                  required=""
                  style="
                    appearance: none;
                    background: rgba(255, 255, 255, 0.03);
                  "
                >
                  <option disabled="" selected="" value="">
                    Select your specialization
                  </option>
                  <option value="AIML">AI / Machine Learning</option>
                  <option value="Web Development">Web Development</option>
                  <option value="Data Science">Data Science</option>
                  <option value="Cybersecurity">Cybersecurity</option>
                  <option value="UI/UX Design">UI/UX Design</option>
                  <option value="Cloud Computing">Cloud Computing</option>
                  <option value="Product Management">Product Management</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="form-group">
                <label for="interests">Interests &amp; Skills</label>
                <input
                  class="form-control"
                  id="interests"
                  placeholder="e.g., AI, React, Product Strategy"
                  required=""
                  type="text"
                />
              </div>
              <div
                style="
                  display: grid;
                  grid-template-columns: 1fr 1fr;
                  gap: 1.5rem;
                "
              >
                <div class="form-group">
                  <label for="experience">Experience Level</label>
                  <select
                    class="form-control"
                    id="experience"
                    required=""
                    style="
                      appearance: none;
                      background: rgba(255, 255, 255, 0.03);
                    "
                  >
                    <option value="Beginner">Beginner</option>
                    <option selected="" value="Intermediate">
                      Intermediate
                    </option>
                    <option value="Expert">Expert</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="workType">Work Preference</label>
                  <select
                    class="form-control"
                    id="workType"
                    required=""
                    style="
                      appearance: none;
                      background: rgba(255, 255, 255, 0.03);
                    "
                  >
                    <option value="Remote">Remote</option>
                    <option value="On-site">On-site</option>
                    <option selected="" value="Hybrid">Hybrid</option>
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label for="careerGoals">Career Goals</label>
                <input
                  class="form-control"
                  id="careerGoals"
                  placeholder="What are you working towards?"
                  required=""
                  type="text"
                />
              </div>
              <button
                class="btn btn-primary btn-block"
                style="margin-top: 1rem"
                type="submit"
              >
                Finish Setup →
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/questions.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (window.initCustomSelects) initCustomSelects();
      });
    </script>
  </body>
</html>
